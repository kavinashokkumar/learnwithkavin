function useReveal(){const r=useRef(null);useEffect(()=>{const el=r.current;if(!el)return;const o=new IntersectionObserver(([e])=>{if(e.isIntersecting){el.classList.add("in");o.disconnect()}},{threshold:.12});o.observe(el);return()=>o.disconnect()},[]);return r}
const Reveal=({children,className="",delay=0})=>{const r=useReveal();return <div ref={r} style={{transitionDelay:delay+"ms"}} className={"rv "+className}>{children}</div>};
const Section=({id,eyebrow,title,children})=>(
  <section id={id} className="relative mx-auto max-w-6xl px-5 py-20 sm:py-24">
    <Reveal><p className="text-sm font-medium tracking-widest uppercase text-cyan-400">{eyebrow}</p>
    <h2 className="mt-2 text-3xl sm:text-4xl font-bold tracking-tight text-white">{title}</h2></Reveal>
    <div className="mt-10">{children}</div>
  </section>);

  useEffect(()=>{const f=()=>setSc(scrollY>20);f();addEventListener("scroll",f,{passive:true});return()=>removeEventListener("scroll",f)},[]);
  return(<header className={"fixed inset-x-0 top-0 z-50 transition "+(sc||open?"glass":"")} style={{paddingTop:"env(safe-area-inset-top,0px)"}}>
    <nav aria-label="Main" className="mx-auto flex h-16 max-w-6xl items-center justify-between px-5">
      <a href="#home" className="font-bold text-white">kavin<span className="grad">.dev</span></a>
      <ul className="hidden md:flex gap-7 text-sm text-zinc-400">{links.map(([h,l])=><li key={h}><a href={"#"+h} className="transition hover:text-white">{l}</a></li>)}</ul>
      <a href="#contact" className="hidden md:inline rounded-full bg-white/10 px-4 py-2 text-sm text-white hover:bg-white/20 transition">Hire me</a>
      <button className="md:hidden p-2 text-white" aria-label="Toggle menu" aria-expanded={open} onClick={()=>setOpen(!open)}><Icon n={open?"x":"menu"} s={24}/></button>
    </nav>
    {open&&<ul className="md:hidden px-5 pb-5 space-y-1">{links.map(([h,l])=><li key={h}><a onClick={()=>setOpen(false)} href={"#"+h} className="block rounded-lg px-3 py-3 text-zinc-300 hover:bg-white/5">{l}</a></li>)}</ul>}
  </header>);
}

function Typer(){
  const words=["Software Development","Artificial Intelligence","Problem Solving"];
  const [w,setW]=useState(0),[t,setT]=useState(""),[del,setDel]=useState(false);
  useEffect(()=>{const full=words[w];let d=del?35:70;
    if(!del&&t===full)d=1600;
    const id=setTimeout(()=>{
      if(!del&&t===full)setDel(true);
      else if(del&&t==="" ){setDel(false);setW((w+1)%words.length)}
      else setT(full.slice(0,t.length+(del?-1:1)));
    },d);return()=>clearTimeout(id)},[t,del,w]);
  return <p className="text-lg sm:text-xl text-zinc-300" aria-label="Software Development, Artificial Intelligence, Problem Solving"><span aria-hidden="true">Passionate about <span className="grad font-semibold">{t}</span><span className="caret"/></span></p>;
}

function Contact(){
  const [f,setF]=useState({name:"",email:"",subject:"",message:""});const [st,setSt]=useState("");
  const on=e=>setF({...f,[e.target.name]:e.target.value});
  const submit=async e=>{e.preventDefault();
    if(!CONFIG.formEndpoint){
      location.href="mailto:"+CONFIG.email+"?subject="+encodeURIComponent(f.subject||"Portfolio enquiry")+"&body="+encodeURIComponent(f.message+"\n\n— "+f.name+" ("+f.email+")");
      setSt("No form backend is configured, so your mail app was opened instead. Set CONFIG.formEndpoint to enable direct sending.");return}
    setSt("Sending…");
    try{const r=await fetch(CONFIG.formEndpoint,{method:"POST",headers:{"Content-Type":"application/json",Accept:"application/json"},body:JSON.stringify(f)});
      if(r.ok){setSt("Thanks! Your message has been sent.");setF({name:"",email:"",subject:"",message:""})}else setSt("Something went wrong. Please email me directly.")}
    catch{setSt("Network error. Please email me directly.")}};
  const inp="mt-1 w-full rounded-xl border border-white/10 bg-white/5 px-4 py-3 text-white placeholder-zinc-500 outline-none transition focus:border-cyan-400/60 focus:ring-2 focus:ring-cyan-400/20";
  return <Section id="contact" eyebrow="Contact" title="Have an Idea? Let's Build Something Together.">
    <div className="grid gap-8 lg:grid-cols-[1fr_1.2fr]">
      <Reveal className="space-y-4">
        {[["mail",CONFIG.email,"mailto:"+CONFIG.email],["phone",CONFIG.phone,"tel:"+CONFIG.phone.replace(/\s/g,"")],["pin",CONFIG.location,null]].map(([i,t,h])=>{
          const c=<><span className="grid h-11 w-11 place-items-center rounded-xl bg-white/5 text-cyan-300"><Icon n={i}/></span><span className="break-all text-zinc-300">{t}</span></>;
          return h?<a key={t} href={h} className="card glass flex items-center gap-4 rounded-2xl p-4">{c}</a>:<div key={t} className="card glass flex items-center gap-4 rounded-2xl p-4">{c}</div>})}
        <div className="flex gap-3 pt-2"><Socials/></div>
      </Reveal>
      <Reveal delay={120}><form onSubmit={submit} className="glass space-y-4 rounded-3xl p-6">
        <div className="grid gap-4 sm:grid-cols-2">
          <label className="text-sm text-zinc-400">Name<input required name="name" value={f.name} onChange={on} placeholder="Your name" className={inp}/></label>
          <label className="text-sm text-zinc-400">Email<input required type="email" name="email" value={f.email} onChange={on} placeholder="you@example.com" className={inp}/></label></div>
        <label className="block text-sm text-zinc-400">Subject<input required name="subject" value={f.subject} onChange={on} placeholder="What's this about?" className={inp}/></label>
        <label className="block text-sm text-zinc-400">Message<textarea required rows="5" name="message" value={f.message} onChange={on} placeholder="Tell me about your idea…" className={inp}/></label>
        <button type="submit" className="inline-flex items-center gap-2 rounded-full bg-gradient-to-r from-cyan-500 to-indigo-500 px-6 py-3 font-semibold text-white transition hover:scale-[1.03]">Send Message<Icon n="send" s={18}/></button>
        <p role="status" aria-live="polite" className="text-sm text-zinc-400">{st}</p>
      </form></Reveal></div></Section>;
}
